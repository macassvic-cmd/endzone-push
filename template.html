<title>Endzone Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --ink:#14201A; --muted:#5C6B63; --line:#DCE2DD;
  --accent:#1F6B45; --accent-soft:#E2EFE7; --hot:#B8641A; --hot-soft:#F7E9DB; --good:#1F7A4A; --bad:#B3392F;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --panel:#151D19; --ink:#E4ECE7; --muted:#93A39A; --line:#26312B;
  --accent:#58C28C; --accent-soft:#193326; --hot:#E3954D; --hot-soft:#3A2715; --good:#58C28C; --bad:#E7766B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --panel:#151D19; --ink:#E4ECE7; --muted:#93A39A; --line:#26312B;
  --accent:#58C28C; --accent-soft:#193326; --hot:#E3954D; --hot-soft:#3A2715; --good:#58C28C; --bad:#E7766B; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:.95;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--accent)}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.games{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.g{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;font-family:var(--mono);font-size:12px;min-width:118px;text-align:left;color:var(--ink)}
.g b{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.02em}
.g.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.g .td{color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{font-family:var(--display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:none;border:0;border-bottom:3px solid transparent;padding:6px 10px;color:var(--muted);cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input,.bar select{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:6px 8px}
.note{color:var(--muted);font-size:13px;max-width:78ch;margin:0}
.tbl{overflow-x:auto;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px}
#view,.wrap>*{min-width:0}
tr.total td{font-weight:600;border-top:2px solid var(--line);background:var(--accent-soft)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-family:var(--display);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--panel)}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
td.n{font-family:var(--body);font-size:14px;font-weight:500}
tr:last-child td{border-bottom:0}
.pos{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:3px;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.q{background:var(--hot-soft);color:var(--hot)}
.bar-cell{position:relative}
.meter{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-right:6px;opacity:.8}
.odds{width:70px;font:inherit;font-family:var(--mono);font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 5px;text-align:right}
.edge-pos{color:var(--good);font-weight:600}.edge-neg{color:var(--bad)}
tr.thin td{opacity:.45}.diff-bad{color:var(--bad);font-weight:600}
details.wk{margin-top:10px}details.wk summary{cursor:pointer;font-family:var(--display);font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:6px 0;color:var(--muted)}details.wk[open] summary{color:var(--ink)}
.role{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:3px;background:var(--accent-soft);color:var(--accent)}.role.b{background:var(--hot-soft);color:var(--hot)}.role.r{background:var(--line);color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;margin-top:12px}
.lift{font-weight:600}.lift.up{color:var(--hot)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h3{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.card .tag{font-family:var(--mono);font-size:11px;color:var(--hot);text-transform:uppercase;letter-spacing:.06em}
.card p{margin:0;color:var(--muted);font-size:13px}
.recv{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px}.rv{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}.rv select{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 4px}
h2.sec{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.ladder{display:flex;gap:4px;align-items:flex-end;height:38px}
.ladder i{display:block;width:16px;background:var(--accent);border-radius:2px 2px 0 0}
</style>

<div class="wrap">
  <header>
    <h1>Endzone <span>Lab</span></h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="games" id="games"></div>
  <nav id="tabs"></nav>
  <div class="bar" id="bar">
    <input id="q" placeholder="Search player or team" aria-label="Search">
    <select id="posf" aria-label="Position"><option value="">All positions</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option></select>
  </div>
  <p class="note" id="note"></p>
  <div id="view"></div>
</div>

<script>
const EMBED = __DATA__;
const EMBED_RES = __RES__;
let D = EMBED;
let RES = (typeof EMBED_RES!=='undefined')?EMBED_RES:null;
const pct = x => (x*100).toFixed(1)+'%';
const am = n => n>0?'+'+n:''+n;
const fair = p => { p=Math.min(Math.max(p,1e-4),1-1e-4); return Math.round(p>=.5? -100*p/(1-p) : 100*(1-p)/p); };
const implied = o => o>0? 100/(o+100) : -o/(-o+100);
let st = {tab:'any', game:'', sort:null, dir:-1, open:new Set(), showBench:false};
try { st.showBench = localStorage.getItem('ezl_bench')==='1'; } catch(e){}
let book = {};
try { book = JSON.parse(localStorage.getItem('ezl_book')||'{}'); } catch(e){}
try { const t=localStorage.getItem('ezl_tab'); if(t) st.tab=t; } catch(e){}
if (location.hash) st.tab = location.hash.slice(1);

function setMeta(){document.getElementById('meta').innerHTML = `${D.season} · WEEK ${D.week}<br>${D.games.length} games · updated ${D.generated}<br>${D.odds_live?(D.odds_asof?`<span style="color:var(--hot)">odds as of ${D.odds_asof} · ${D.n_events} events</span>`:`<span style="color:var(--good)">live odds · ${D.n_events} events</span>`):'no live odds feed'}`;}
st.recv = {};
const recvMult = (r) => { const g=D.games.find(x=>x.game_id===r.game_id); const v=st.recv[r.game_id]; if(!g||!v) return r.p_first;
  const mine = (v==='home') === (r.team===g.home); return mine ? r.first_if_recv : r.first_if_kick; };

const TABS = {
 any:{label:'Anytime TD', note:'Probability of a rushing or receiving TD. Fair = no-vig American price. Type a book price to see your edge (saved in this browser).'},
 top15:{label:'Top 15', note:'This week\'s 15 highest anytime-TD projections with fair odds and the best book price, then how past weeks\' top 15 did, then everyone who has made a top 15.'},
 first:{label:'First TD', note:'First TD of the game. Set who receives the opening kickoff once the coin toss is known: the receiving team scores the first TD about 59% of the time at even odds (2023–25 data). Books are often slow to move after the toss.'},
 rz:{label:'Red Zone', note:'Red-zone and end-zone usage from play-by-play. Share = player\'s cut of his team\'s red-zone carries, inside-10 carries, red-zone targets and end-zone targets. Switch seasons to compare with 2025.'},
 bring:{label:'Bring-backs', note:'Pass catchers on opposite sides of the same game both scoring. Lift shows shared game-script correlation.'},
 edge:{label:'Edge Board', note:''},
 results:{label:'Results', note:'How the projections did once games were played. Weeks marked backfill were rebuilt after the fact from pre-game data only (no odds).'}
};
const tabs=document.getElementById('tabs');
Object.entries(TABS).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v.label;b.dataset.k=k;b.onclick=()=>{st.tab=k;st.sort=null;try{localStorage.setItem('ezl_tab',k)}catch(e){};render()};tabs.appendChild(b)});

const gEl=document.getElementById('games');
function gameBtns(){
  gEl.innerHTML='';
  const all=document.createElement('button');all.className='g'+(st.game===''?' on':'');all.innerHTML='<b>ALL GAMES</b><br><span class="td">full slate</span>';all.onclick=()=>{st.game='';render()};gEl.appendChild(all);
  D.games.forEach(g=>{const b=document.createElement('button');b.className='g'+(st.game===g.game_id?' on':'');
    const wx=g.wx?`${Math.round(g.wx.wind)} mph${g.wx.precip>=50?' · rain':''}`:(g.indoor?'indoor':'no forecast');
    b.innerHTML=`<b>${g.away} @ ${g.home}</b><br>${g.away_imp.toFixed(1)}–${g.home_imp.toFixed(1)}<br><span class="td">${g.exp_td.toFixed(2)} exp TD · ${wx}</span>`;
    b.title=`Lines: ${g.lines||'nflverse'}`;
    b.onclick=()=>{st.game=g.game_id;render()};gEl.appendChild(b)});
}
const gameOf = t => (D.games.find(g=>g.home===t||g.away===t)||{}).game_id;

function table(cols, rows, defSort){
  const s = st.sort || defSort;
  rows = rows.slice().sort((a,b)=>{const x=a[s],y=b[s];return (typeof x==='string'? x.localeCompare(y): (x-y))*st.dir});
  let h='<div class="tbl"><table><thead><tr>'+cols.map(c=>`<th class="${c.l?'l':''}" data-k="${c.k}" scope="col">${c.h}${(s===c.k)?(st.dir<0?' ▾':' ▴'):''}</th>`).join('')+'</tr></thead><tbody>';
  h+=rows.map(r=>'<tr>'+cols.map(c=>`<td class="${c.cls||''} ${c.l?'l':''}">${c.f?c.f(r):r[c.k]}</td>`).join('')+'</tr>').join('');
  return h+'</tbody></table></div>';
}
function filt(rows, teamKey='team', nameKey='name'){
  const q=document.getElementById('q').value.toLowerCase(), pf=document.getElementById('posf').value;
  return rows.filter(r=>(!st.game||gameOf(r[teamKey])===st.game)&&(!pf||!r.pos||r.pos===pf)&&(!q||(r[nameKey]+' '+r[teamKey]).toLowerCase().includes(q)));
}
const nameCell = r => `${r.name}<span class="pos">${r.pos||''}</span>${r.questionable?'<span class="pos q">Q</span>':''}${r.weak_spot?'<span class="pos q" title="Model weak spot: mobile QBs are under-predicted in the backtest (see CHANGELOG). Not an edge; kept off the Edge Board.">weak spot</span>':''}`;
const roleTag=r=>`<span class="role ${r==='Bench'?'b':r==='Rotational'?'r':''}">${r||'?'}</span>`;
const wkKey=w=>`${w.season}-${w.week}`;
const wkHead=w=>`${w.season} W${w.week}${w.backfill?' <span class="pos">backfill</span>':''} · ${w.hit}/15 hit, expected ${w.exp}`;
const wkTable=w=>table([{k:'name',h:'Player',l:1,cls:'n',f:r=>`${r.name}<span class="pos">${r.pos||''}</span>`},{k:'team',h:'Tm',l:1},{k:'p_any',h:'Projection',f:r=>pct(r.p_any)},{k:'hit',h:'Scored',f:r=>r.hit?'<span class="edge-pos">✓</span>':'<span class="edge-neg">✗</span>'}],w.rows,'p_any');
const meter = (p,max) => `<span class="meter" style="width:${Math.round(p/max*60)}px"></span>${pct(p)}`;
function bookCell(r,pre,p,key){
  if(r[pre+'best']!=null){const ev=r[pre+'ev'];return `<span title="${r[pre+'nbooks']} books · median ${am(r[pre+'med'])} (EV ${(r[pre+'ev_med']*100).toFixed(1)}%) · market ${pct(r[pre+'mkt_p'])} · blend ${pct(r[pre+'blend_p'])} · model-only EV ${(r[pre+'model_ev']*100).toFixed(1)}%">${am(r[pre+'best'])} <span style="color:var(--muted)">${(r[pre+'book']||'').slice(0,10)}</span></span> <span class="${ev>=0.05?'edge-pos':ev<0?'edge-neg':''}">${(ev*100).toFixed(1)}%</span>`}
  return oddsCell(key,p)}
function oddsCell(key,p){const v=book[key]??'';let e='';if(v!==''&&!isNaN(+v)&&Math.abs(+v)>=100){const ev=p*(+v>0? +v/100 : 100/-v)-(1-p);e=`<span class="${ev>0?'edge-pos':'edge-neg'}"> ${(ev*100).toFixed(1)}%</span>`}
  return `<input class="odds" id="o-${key.replace(/[^a-z0-9]/gi,'_')}" data-key="${key}" data-p="${p}" value="${v}" placeholder="+odds" inputmode="numeric" aria-label="Book odds">${e}`}

function render(){
  gameBtns();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===st.tab));
  document.getElementById('note').textContent=TABS[st.tab].note;
  document.getElementById('bar').hidden = st.tab==='edge'||st.tab==='results'||st.tab==='top15';
  const V=document.getElementById('view'); let html='';
  if(st.tab==='any'){
    const rows=filt(D.players).filter(r=>r.p_any>0.02);
    html=table([
      {k:'name',h:'Player',l:1,cls:'n',f:nameCell},{k:'team',h:'Tm',l:1,f:r=>`${r.team} <span style="color:var(--muted)">v ${r.opp}</span>`},
      {k:'rush_share',h:'Rush sh',f:r=>pct(r.rush_share)},{k:'rec_share',h:'Rec sh',f:r=>pct(r.rec_share)},
      {k:'xtd',h:'Exp TD',f:r=>r.xtd.toFixed(2)},{k:'p_any',h:'Anytime',f:r=>meter(r.p_any,.75)},{k:'fair_any',h:'Fair',f:r=>am(r.fair_any)},
      {k:'p_2plus',h:'2+ TD',f:r=>pct(r.p_2plus)},{k:'fair_2plus',h:'Fair 2+',f:r=>am(r.fair_2plus)},
      {k:'snap_last',h:'Snap %',f:r=>r.snap_last==null?'–':`${Math.round(r.snap_last*100)}%${r.snap_trend>0.08?' <span class="edge-pos">▲</span>':r.snap_trend<-0.08?' <span class="edge-neg">▼</span>':''}`},
      {k:'any_ev',h:'Best price / EV',f:r=>bookCell(r,'any_',r.p_any,'any|'+r.name+'|'+r.team)}],rows,'p_any');
  } else if(st.tab==='first'){
    const rows=filt(D.players).filter(r=>r.p_first>0.005).map(r=>({...r,p_first:recvMult(r)}));
    const gl=D.games.filter(g=>!st.game||g.game_id===st.game);
    html=`<div class="recv">${gl.map(g=>`<label class="rv"><span>${g.away} @ ${g.home} receives</span><select data-g="${g.game_id}" id="rv-${g.game_id}"><option value="">Unknown</option><option value="away" ${st.recv[g.game_id]==='away'?'selected':''}>${g.away}</option><option value="home" ${st.recv[g.game_id]==='home'?'selected':''}>${g.home}</option></select></label>`).join('')}</div>`+table([
      {k:'name',h:'Player',l:1,cls:'n',f:nameCell},{k:'team',h:'Tm',l:1},
      {k:'p_first',h:'1st TD',f:r=>meter(r.p_first,.16)},{k:'p_first',h:'Fair',f:r=>am(fair(r.p_first))},
      {k:'p_team_first',h:'Team 1st',f:r=>pct(r.p_team_first)},{k:'tf',h:'Fair tm 1st',f:r=>am(fair(r.p_team_first))},
      {k:'q1_share',h:'Q1 share',f:r=>r.q1_share==null?'–':pct(r.q1_share)},
      {k:'first_ev',h:'Best price / EV',f:r=>{const rr={...r};if(rr.first_best!=null){const bp=(r.p_first+r.first_mkt_p)/2;rr.first_blend_p=bp;rr.first_model_ev=r.p_first*(r.first_best>0?1+r.first_best/100:1+100/-r.first_best)-1;rr.first_ev=bp*(r.first_best>0?1+r.first_best/100:1+100/-r.first_best)-1}return bookCell(rr,'first_',r.p_first,'first|'+r.name+'|'+r.team)}}],rows,'p_first');
  } else if(st.tab==='rz'){
    const yr=+(document.getElementById('rzs')?.value||D.season);
    const rows=filt((D.redzone||[]).filter(r=>r.season===yr));
    const sh=(x)=>x?pct(x):'–';
    html=`<div class="bar" style="margin-bottom:10px"><label for="rzs">Season</label><select id="rzs">${[D.season,D.season-1].map(y=>`<option ${y===yr?'selected':''} value="${y}">${y}</option>`).join('')}</select></div>`+table([
      {k:'name',h:'Player',l:1,cls:'n',f:r=>`${r.name}<span class="pos">${r.pos||''}</span>`},{k:'team',h:'Tm',l:1},{k:'g',h:'G'},
      {k:'rz_car',h:'RZ car'},{k:'rz_car_sh',h:'RZ car %',f:r=>sh(r.rz_car_sh)},{k:'i10_car',h:'In-10'},{k:'i10_car_sh',h:'In-10 %',f:r=>sh(r.i10_car_sh)},{k:'i5_car',h:'In-5'},
      {k:'rz_tgt',h:'RZ tgt'},{k:'rz_tgt_sh',h:'RZ tgt %',f:r=>sh(r.rz_tgt_sh)},{k:'ez_tgt',h:'EZ tgt'},{k:'ez_tgt_sh',h:'EZ tgt %',f:r=>sh(r.ez_tgt_sh)},
      {k:'rz_opp',h:'RZ opps'},{k:'td',h:'TD'}],rows,'rz_opp');
  } else if(st.tab==='top15'){
    const cur=D.players.slice().sort((a,b)=>b.p_any-a.p_any).slice(0,15);
    const R=RES||{}, t15=R.top15_by_week||[], reg=R.top15_regulars||[];
    html=`<h2 class="sec">This week · ${D.season} W${D.week}</h2><p class="note" style="margin-bottom:6px">Expected ${cur.reduce((a,r)=>a+r.p_any,0).toFixed(1)} of 15 to score. Fair = no-vig price for the model probability.</p>`+table([
      {k:'name',h:'Player',l:1,cls:'n',f:nameCell},{k:'team',h:'Tm',l:1},{k:'role',h:'Role',l:1,f:r=>roleTag(r.role)},
      {k:'p_any',h:'Anytime',f:r=>pct(r.p_any)},{k:'fair_any',h:'Fair',f:r=>am(r.fair_any)},
      {k:'any_best',h:'Best price',f:r=>r.any_best!=null?`${am(r.any_best)} <span style="color:var(--muted)">${(r.any_book||'').slice(0,10)}</span>`:'–'},
      {k:'any_mkt_p',h:'Market',f:r=>r.any_mkt_p!=null?pct(r.any_mkt_p):'–'}],cur,'p_any')+
      (t15.length?`<h2 class="sec" style="margin-top:16px">Past weeks</h2>`+t15.map((w,i)=>i===0
          ?`<p class="note" style="margin-bottom:6px">${wkHead(w)}</p>`+wkTable(w)
          :`<details class="wk" data-wk="${wkKey(w)}"${st.open.has(wkKey(w))?' open':''}><summary>${wkHead(w)}</summary>${wkTable(w)}</details>`).join(''):'<p class="note" style="margin-top:16px">No graded weeks yet.</p>')+
      (reg.length?`<h2 class="sec" style="margin-top:16px">Top-15 regulars</h2><p class="note" style="margin-bottom:6px">Everyone who has made a week's top 15. Diff = hit rate minus average projection; red when the hit rate trails by 15+ points over 3+ appearances.</p>`+table([
        {k:'name',h:'Player',l:1,cls:'n',f:r=>`${r.name}<span class="pos">${r.pos||''}</span>`},{k:'team',h:'Tm',l:1},
        {k:'n',h:'In top 15'},{k:'hits',h:'Scored'},{k:'hit_rate',h:'Hit rate',f:r=>pct(r.hit_rate)},{k:'avg_p',h:'Avg proj',f:r=>pct(r.avg_p)},
        {k:'diff',h:'Diff',f:r=>`<span class="${(r.diff<=-0.15&&r.n>=3)?'diff-bad':''}">${r.diff>0?'+':''}${(r.diff*100).toFixed(1)}</span>`}],reg,'n'):'');
  } else if(st.tab==='results'){
    const R=RES; if(!R){html='<p class="note">No graded weeks yet.</p>';}
    else{
      const b=R.bet_summary, bt=R.backtest_2025, mb=R.market_brier||{}, cv=R.clv;
      const calTable=rows=>`<div class="tbl" style="border:0"><table><thead><tr><th class="l">Bucket</th><th>Props</th><th>Avg proj</th><th>Actual</th><th>±</th></tr></thead><tbody>${rows.map(c=>`<tr class="${c.thin?'thin':''}"><td class="l">${c.bucket}</td><td>${c.n}</td><td>${pct(c.pred)}</td><td>${pct(c.act)}</td><td>${(c.ci*100).toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`;
      html=`<h2 class="sec">Weekly scorecard</h2>`+table([
        {k:'week',h:'Week',l:1,f:r=>`${r.season} W${r.week}${r.backfill?' <span class="pos">backfill</span>':''}`},{k:'games',h:'Games graded',f:r=>r.partial?`${r.games} of ${r.games_total} <span class="pos q">partial</span>`:`${r.games}`},
        {k:'act_scorers',h:'Scorers: actual / exp',f:r=>`${r.act_scorers} / ${r.exp_scorers}`},
        {k:'top15_hit',h:'Top 15 hit',f:r=>`${r.top15_hit} / 15 <span style="color:var(--muted)">exp ${r.top15_exp}</span>`},
        {k:'strong_hit',h:'40%+ scored–missed',f:r=>`${r.strong_hit}–${r.strong_n-r.strong_hit} <span style="color:var(--muted)">exp ${r.strong_exp}</span>`},
        {k:'first_top3',h:'1st TD in our top 3',f:r=>`${r.first_top3} / ${r.first_games} <span style="color:var(--muted)">exp ${r.first_top3_exp==null?'–':r.first_top3_exp}</span>`},
        {k:'brier',h:'Brier',f:r=>r.brier.toFixed(3)}],R.weeks,'week').replace('</tbody></table>',(T=>T?`<tr class="total"><td class="l">${T.season} season · ${T.weeks} wk</td><td>${T.games<T.games_total?`${T.games} of ${T.games_total}`:T.games}</td><td>${T.act_scorers} / ${T.exp_scorers}</td><td>${T.top15_hit} / ${T.top15_n} <span style="color:var(--muted)">exp ${T.top15_exp}</span></td><td>${T.strong_hit}–${T.strong_n-T.strong_hit} <span style="color:var(--muted)">exp ${T.strong_exp}</span></td><td>${T.first_top3} / ${T.first_games} <span style="color:var(--muted)">exp ${T.first_top3_exp}</span></td><td>${T.brier==null?'–':T.brier.toFixed(3)}</td></tr></tbody></table>`:'</tbody></table>')(R.season_total))+
      `<div class="cards" style="margin-top:16px">
        <div class="card"><span class="tag">Priced bets</span><h3>${b.n?`${b.won}-${b.n-b.won} · ${b.units>0?'+':''}${b.units}u`:'No graded bets yet'}</h3><p>${b.n?`ROI ${(b.roi*100).toFixed(1)}% at 1 unit per bet on every Edge Board play, bench plays included. Expected ${b.expected_units>0?'+':''}${b.expected_units}u from the EV at the prices taken.${b.by_price&&b.by_price.under_1000&&b.by_price.under_1000.n?` Excluding +1000 or longer: ${b.by_price.under_1000.won}-${b.by_price.under_1000.n-b.by_price.under_1000.won}, ${b.by_price.under_1000.units>0?'+':''}${b.by_price.under_1000.units}u (expected ${b.by_price.under_1000.expected_units>0?'+':''}${b.by_price.under_1000.expected_units}u).`:''}${b.n<100?` <span class="edge-neg">Only ${b.n} bets graded: at this size the result is mostly variance.</span>`:''}`:'Edge Board plays are graded here once the odds feed has run on a slate.'}</p>${b.n?`<div class="tbl" style="border:0"><table><thead><tr><th class="l">Split</th><th>Record</th><th>Units</th><th>Expected</th><th>ROI</th></tr></thead><tbody>${[...Object.entries(b.by_role||{}).map(([k,v])=>[roleTag(k),v]),...Object.entries(b.by_market||{}).map(([k,v])=>[k==='first'?'First TD':'Anytime TD',v]),...Object.entries(b.by_price||{}).map(([k,v])=>[k==='1000_plus'?'+1000 or longer':'Shorter than +1000',v])].filter(([k,v])=>v&&v.n).map(([k,v])=>`<tr><td class="l">${k}</td><td>${v.won}-${v.n-v.won}</td><td>${v.units>0?'+':''}${v.units}u</td><td>${v.expected_units>0?'+':''}${v.expected_units}u</td><td>${v.roi==null?'–':(v.roi*100).toFixed(1)+'%'}</td></tr>`).join('')}</tbody></table></div>`:''}<p style="margin-top:6px">${mb.any?`Market Brier · anytime TD, season to date: model ${mb.any.model} vs books ${mb.any.market} (blend ${mb.any.blend}) over ${mb.any.n} priced players, ${mb.any.weeks} week${mb.any.weeks===1?'':'s'}.${mb.first?` First TD: model ${mb.first.model} vs books ${mb.first.market}.`:''}`:'Market Brier (model vs no-vig median-book price) appears once a priced week is graded.'}</p>${mb.any&&mb.any.by_week&&mb.any.by_week.length>1?`<div class="tbl" style="border:0"><table><thead><tr><th class="l">Week</th><th>Priced</th><th>Model</th><th>Books</th><th>Blend</th></tr></thead><tbody>${mb.any.by_week.map(w=>`<tr><td class="l">${w.season} W${w.week}</td><td>${w.n}</td><td>${w.model}</td><td>${w.market}</td><td>${w.blend}</td></tr>`).join('')}</tbody></table></div>`:''}${cv?`<p style="margin-top:6px">Closing line value · ${cv.n} flagged edges: average ${(cv.avg_clv*100).toFixed(2)} pts of no-vig probability, ${(cv.beat_close*100).toFixed(0)}% beat the close.</p><div class="tbl" style="border:0"><table><thead><tr><th class="l">Split</th><th>Edges</th><th>Avg CLV</th><th>Beat close</th></tr></thead><tbody>${[...Object.entries(cv.by_role||{}).map(([k,v])=>[roleTag(k),v]),...Object.entries(cv.by_market||{}).map(([k,v])=>[k==='first'?'First TD':'Anytime TD',v])].map(([k,v])=>`<tr><td class="l">${k}</td><td>${v.n}</td><td>${v.avg_clv==null?'–':(v.avg_clv*100).toFixed(2)}</td><td>${v.beat_close==null?'–':(v.beat_close*100).toFixed(0)+'%'}</td></tr>`).join('')}</tbody></table></div>`:'<p style="margin-top:6px">Closing line value (flag-time vs last pull before kickoff) appears once a week with logged edges is graded.</p>'}</div>
        </div>
      <div class="cal-grid">
        <div class="card"><span class="tag">Calibration · ${R.cal_season||''}</span><h3>Predicted vs actual</h3><p>5-point buckets. ± is a 95% range on the actual rate (1.96·√(p(1−p)/n)); buckets with fewer than 10 props are greyed.</p>${calTable(R.calibration||[])}</div>
        <div class="card"><span class="tag">Backtest · 2025</span><h3>${bt?`Brier ${bt.brier} vs ${bt.baseline}`:'Not run yet'}</h3><p>${bt?`${bt.note}. ${bt.props} props, hit rate ${pct(bt.hit_rate)}. Baseline = ${bt.baseline_note}.`:'Run python backtest.py 0.35 and commit backtest_2025.json.'}</p>${bt?calTable(bt.calibration):''}</div>
      </div>`+
      (R.last_week.length?`<h2 class="sec" style="margin-top:16px">${R.last_week_meta?`${R.last_week_meta.season} Week ${R.last_week_meta.week} top 40 · ${R.last_week_meta.graded} of ${R.last_week_meta.total} games graded`:'Last graded week · top 40'}</h2>`+table([
        {k:'name',h:'Player',l:1,cls:'n',f:r=>`${r.name}<span class="pos">${r.pos||''}</span>`},{k:'team',h:'Tm',l:1},
        {k:'p_any',h:'Anytime',f:r=>pct(r.p_any)},{k:'hit',h:'Scored',f:r=>r.hit?'<span class="edge-pos">✓</span>':'<span class="edge-neg">✗</span>'},
        {k:'p_first',h:'1st TD',f:r=>pct(r.p_first)},{k:'first_hit',h:'1st?',f:r=>r.first_hit?'<span class="edge-pos">✓</span>':''}],R.last_week,'p_any'):'')+
      (R.bets.length?`<h2 class="sec" style="margin-top:16px">Bet log</h2>`+table([{k:'week',h:'Wk',l:1},{k:'bet',h:'Bet',l:1,cls:'n'},{k:'price',h:'Price',f:r=>am(r.price)},{k:'book',h:'Book',l:1},{k:'ev',h:'EV',f:r=>(r.ev*100).toFixed(1)+'%'},{k:'profit',h:'Result',f:r=>`<span class="${r.won?'edge-pos':'edge-neg'}">${r.profit>0?'+':''}${r.profit}u</span>`}],R.bets,'week'):'');
    }
  } else if(st.tab==='bring'){
    const rows=filt(D.bring.map(r=>({...r,name:r.a+' '+r.b,team:r.a_team})));
    html=table([{k:'game',h:'Game',l:1},{k:'a',h:'Side A',l:1,cls:'n',f:r=>`${r.a} <span style="color:var(--muted)">${r.a_team}</span>`},{k:'b',h:'Side B',l:1,cls:'n',f:r=>`${r.b} <span style="color:var(--muted)">${r.b_team}</span>`},
      {k:'joint',h:'Both score',f:r=>pct(r.joint)},{k:'lift',h:'Lift',f:r=>`<span class="lift ${r.lift>1.1?'up':''}">${r.lift.toFixed(2)}×</span>`},{k:'fair',h:'Fair',f:r=>am(r.fair)},
      {k:'bk',h:'Book / edge',f:r=>oddsCell('bb|'+r.a+'|'+r.b,r.joint)}],rows,'joint');
  } else {
    const vac=D.vacated.filter(v=>!st.game||gameOf(v.team)===st.game);
    const edAll=(D.edges||[]).filter(e=>!st.game||gameOf(e.team)===st.game), nBench=edAll.filter(e=>e.role==='Bench').length;
    const ed=edAll.filter(e=>st.showBench||e.role!=='Bench');
    const nWeak=(D.players||[]).filter(p=>p.weak_spot).length;
    html=(D.odds_live?`<p class="note" style="margin-bottom:8px">${D.odds_asof?`Prices as of ${D.odds_asof} (live feed off this run). `:''}${nWeak?`${nWeak} mobile QBs are tagged "weak spot" and kept off this board. `:''}<label><input type="checkbox" id="showbench"${st.showBench?' checked':''}> Show bench players (${nBench} hidden${st.showBench?', shown':''}) · Starter = top depth slot or 60%+ snaps, Rotational = 30–60%, Bench = under 30% or a deep depth slot</label></p><h2 class="sec">Priced edges · 2+ books, EV 5%+ at the median book, 50/50 model–market blend, market de-vigged with each book's measured hold</h2>`+(ed.length?table([{k:'bet',h:'Bet',l:1,cls:'n'},{k:'team',h:'Tm',l:1},{k:'role',h:'Role',l:1,f:r=>roleTag(r.role)},{k:'model_p',h:'Model',f:r=>pct(r.model_p)},{k:'mkt_p',h:'Market',f:r=>pct(r.mkt_p)},{k:'blend_p',h:'Blend',f:r=>pct(r.blend_p)},{k:'nbooks',h:'Books'},{k:'med',h:'Median',f:r=>am(r.med)},{k:'ev_med',h:'EV@med',f:r=>`<span class="edge-pos">${(r.ev_med*100).toFixed(1)}%</span>`},{k:'best',h:'Best',f:r=>am(r.best)},{k:'book',h:'Book',l:1},{k:'ev',h:'EV@best',f:r=>`<span class="edge-pos">${(r.ev*100).toFixed(1)}%</span>`},{k:'kalshi',h:'Kalshi',f:r=>r.kalshi==null?'–':r.kalshi_liquid?am(r.kalshi):`<span style="color:var(--muted)" title="under $100 available at the ask: reference only, not used for EV">${am(r.kalshi)} ref</span>`}],ed,'ev_med'):'<p class="note">No bets clear 5% EV right now.</p>'):'<p class="note">Live odds are off. Add an ODDS_API_KEY secret in GitHub to fill this board automatically.</p>')+`<div class="cards" style="margin-top:14px">
      <div class="card"><span class="tag">Live this week</span><h3>Vacated TD share</h3><p>Players ruled out or on IR who held real red-zone opportunity. Their teammates' projections already absorb it; books often lag.</p>
        <div class="tbl" style="border:0">${vac.length?`<table><tbody>${vac.map(v=>`<tr><td class="n l">${v.name}</td><td class="l">${v.team}</td><td>${v.kind}</td><td>${pct(v.share)}</td></tr>`).join('')}</tbody></table>`:'<p>None on this game.</p>'}</div></div>

      ${[
       ['Next build','Pick\'em yardage lines','Receiving/rushing/passing yard medians for Underdog and PrizePicks from the same sim, so TD and yardage legs correlate correctly.'],
       ['Next build','Red-zone snap share','2025 backtest: red-zone snap share adds real signal on top of this model (p = 0.001). Needs a 2026 source such as McAnalytics.'],
       ['Next build','Closing line tracker','Log bets against the closing price to confirm the model beats the market over time.']
      ].map(c=>`<div class="card"><span class="tag">${c[0]}</span><h3>${c[1]}</h3><p>${c[2]}</p></div>`).join('')}
    </div>`;
  }
  V.innerHTML=html;
  const sb=document.getElementById('showbench'); if(sb) sb.onchange=()=>{st.showBench=sb.checked;try{localStorage.setItem('ezl_bench',sb.checked?'1':'0')}catch(e){};render()};
  V.querySelectorAll('details.wk').forEach(d=>d.ontoggle=()=>{if(d.open)st.open.add(d.dataset.wk);else st.open.delete(d.dataset.wk)});
  V.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(st.sort===k)st.dir*=-1;else{st.sort=k;st.dir=-1}render()});
  V.querySelectorAll('.odds').forEach(i=>i.onchange=()=>{const v=i.value.trim();if(v)book[i.dataset.key]=v;else delete book[i.dataset.key];try{localStorage.setItem('ezl_book',JSON.stringify(book))}catch(e){};render()});
  const kf=document.getElementById('rzs'); if(kf) kf.onchange=()=>{st.sort=null;render()};
  V.querySelectorAll('.rv select').forEach(x=>x.onchange=()=>{st.recv[x.dataset.g]=x.value;render()});
}
document.getElementById('q').oninput=render;document.getElementById('posf').onchange=render;
async function boot(){ if(!D){ try{ D = await (await fetch('latest.json',{cache:'no-store'})).json(); }catch(e){ document.getElementById('view').innerHTML='<p class="note">Could not load latest.json. The weekly job may not have run yet.</p>'; return; } }
  if(!RES){ try{ RES = await (await fetch('results.json',{cache:'no-store'})).json(); }catch(e){} }
  if(!TABS[st.tab]) st.tab='any';
  setMeta(); render(); }
boot();
</script>
