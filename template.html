<title>Endzone Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --ink:#14201A; --muted:#5C6B63; --line:#DCE2DD;
  --accent:#1F6B45; --accent-soft:#E2EFE7; --hot:#B8641A; --hot-soft:#F7E9DB; --good:#1F7A4A; --bad:#B3392F;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --panel:#151D19; --ink:#E4ECE7; --muted:#93A39A; --line:#26312B;
  --accent:#58C28C; --accent-soft:#193326; --hot:#E3954D; --hot-soft:#3A2715; --good:#58C28C; --bad:#E7766B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --panel:#151D19; --ink:#E4ECE7; --muted:#93A39A; --line:#26312B;
  --accent:#58C28C; --accent-soft:#193326; --hot:#E3954D; --hot-soft:#3A2715; --good:#58C28C; --bad:#E7766B; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:.95;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--accent)}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.games{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.g{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;font-family:var(--mono);font-size:12px;min-width:118px;text-align:left;color:var(--ink)}
.g b{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.02em}
.g.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.g .td{color:var(--muted)}

.paper{display:inline-block;background:var(--hot-soft);color:var(--hot);border:1px solid var(--hot);border-radius:4px;padding:1px 7px;font-family:var(--mono);font-size:11px;letter-spacing:.02em;margin-left:6px;vertical-align:middle;text-transform:none}

textarea{width:100%;box-sizing:border-box;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font-family:var(--mono);font-size:13px;resize:vertical}
.btn{background:var(--accent);color:#0b1a12;border:0;border-radius:6px;padding:6px 12px;font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer;margin-left:6px}
.lnk{background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:11px;cursor:pointer;text-decoration:underline}
code{font-family:var(--mono);font-size:12px;background:var(--panel);padding:1px 4px;border-radius:3px}
.g.locked{opacity:.45}
.g.locked .kt{color:var(--muted)}
.ggrp{flex:0 0 auto;display:flex;align-items:center;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 2px 0 8px;border-left:1px solid var(--line);white-space:nowrap}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{font-family:var(--display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:none;border:0;border-bottom:3px solid transparent;padding:6px 10px;color:var(--muted);cursor:pointer}

button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

#view,.wrap>*{min-width:0}
tr.total td{font-weight:600;border-top:2px solid var(--line);background:var(--accent-soft)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-family:var(--display);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--panel)}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
td.n{font-family:var(--body);font-size:14px;font-weight:500}
tr:last-child td{border-bottom:0}
.pos{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:3px;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.q{background:var(--hot-soft);color:var(--hot)}
.bar-cell{position:relative}
.meter{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-right:6px;opacity:.8}
.odds{width:70px;font:inherit;font-family:var(--mono);font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 5px;text-align:right}
.edge-pos{color:var(--good);font-weight:600}.edge-neg{color:var(--bad)}
tr.thin td{opacity:.45}.diff-bad{color:var(--bad);font-weight:600}
details.wk{margin-top:10px}details.wk summary{cursor:pointer;font-family:var(--display);font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:6px 0;color:var(--muted)}details.wk[open] summary{color:var(--ink)}
.role{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:3px;background:var(--accent-soft);color:var(--accent)}.role.b{background:var(--hot-soft);color:var(--hot)}.role.r{background:var(--line);color:var(--muted)}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;align-items:start}
@media(max-width:860px){.res-grid{grid-template-columns:1fr}}
.res-grid .card{min-width:0}.res-grid .tbl{overflow-x:hidden;max-width:100%}.res-grid table{table-layout:auto;font-size:11.5px}.res-grid td,.res-grid th{white-space:normal;padding:4px 5px;font-size:11.5px}
.chart{width:100%;height:auto;display:block;margin-top:6px}.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}.chart .ax{stroke:var(--line)}
.cal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;margin-top:12px}
.lift{font-weight:600}.lift.up{color:var(--hot)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h3{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.card .tag{font-family:var(--mono);font-size:11px;color:var(--hot);text-transform:uppercase;letter-spacing:.06em}
.card p{margin:0;color:var(--muted);font-size:13px}
.recv{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px}.rv{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}.rv select{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 4px}
h2.sec{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.ladder{display:flex;gap:4px;align-items:flex-end;height:38px}
.ladder i{display:block;width:16px;background:var(--accent);border-radius:2px 2px 0 0}
</style>

<div class="wrap">
  <header>
    <h1>Endzone <span>Lab</span></h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="games" id="games"></div>
  <nav id="tabs"></nav>
  <div class="bar" id="bar">
    <input id="q" placeholder="Search player or team" aria-label="Search">
    <select id="posf" aria-label="Position"><option value="">All positions</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option></select>
  </div>
  <p class="note" id="note"></p>
  <div id="view"></div>
</div>

<script>
const EMBED = __DATA__;
const EMBED_RES = __RES__;
let D = EMBED;
let RES = (typeof EMBED_RES!=='undefined')?EMBED_RES:null;
const pct = x => (x*100).toFixed(1)+'%';
const am = n => n>0?'+'+n:''+n;
const fair = p => { p=Math.min(Math.max(p,1e-4),1-1e-4); return Math.round(p>=.5? -100*p/(1-p) : 100*(1-p)/p); };
const implied = o => o>0? 100/(o+100) : -o/(-o+100);
let st = {tab:'any', game:'', sort:null, dir:-1, open:new Set(), showBench:false, bookPrice:{}, pmode:'likely', mkt:'all', shortOnly:false, ykind:''};
try { st.showBench = localStorage.getItem('ezl_bench')==='1'; } catch(e){}
let book = {};
try { book = JSON.parse(localStorage.getItem('ezl_book')||'{}'); } catch(e){}
try { const t=localStorage.getItem('ezl_tab'); if(t) st.tab=t; } catch(e){}
try { st.slipText = localStorage.getItem('ezl_slipdraft') || ''; } catch(e){}
if (location.hash) st.tab = location.hash.slice(1);

function setMeta(){document.getElementById('meta').innerHTML = `${D.season} · WEEK ${D.week}<br>${D.games.length} games · updated ${D.generated}<br>${D.odds_live?(D.odds_asof?`<span style="color:var(--hot)">odds as of ${D.odds_asof} · ${D.n_events} events</span>`:`<span style="color:var(--good)">live odds · ${D.n_events} events</span>`):'no live odds feed'}`;}
st.recv = {};
const recvMult = (r) => { const g=D.games.find(x=>x.game_id===r.game_id); const v=st.recv[r.game_id]; if(!g||!v) return r.p_first;
  const mine = (v==='home') === (r.team===g.home); return mine ? r.first_if_recv : r.first_if_kick; };

const TABS = {
 any:{label:'Anytime TD', note:'Probability of a rushing or receiving TD. Fair = no-vig American price. Type a book price to see your edge (saved in this browser).'},
 top15:{label:'Top 15', note:'This week\'s 15 highest anytime-TD projections with fair odds and the best book price, then how past weeks\' top 15 did, then everyone who has made a top 15.'},
 two:{label:'2+ TD', note:'Two or more rushing/receiving TDs in the game. Fair = no-vig price for the model probability; the book line is Over 1.5 touchdowns (Kalshi: "2+"). Validated on the 2024-25 backtests, see CHANGELOG.'},
 parlays:{label:'Parlays', note:'2+ TD parlays, Starter legs only, every leg from a different game, no weak-spot QBs. Most likely = legs ranked by model probability, parlays by joint probability. Best value = legs at 10%+ EV with real liquidity, parlays by EV. Price = product of best-book odds unless you type a book\'s parlay/SGP price. Stake = 1/8 Kelly capped at 0.25% of bankroll, 0 when the price is not worth it. The top 3 of each mode are tracked each week.'},
 yards:{label:'Yards', note:'Rushing, receiving and passing yards from the same sim games as the TDs. Median and mean, the book\'s main line with our lean for pick\'em (Underdog / PrizePicks higher-lower), P(over) and fair odds per rung, best price and EV at the median book. Backtest gate: 2024-25 weeks 4-18, see CHANGELOG.'},
 slips:{label:'Slips', note:'Underdog-style slips priced from this week\'s sim games: paste legs, get each leg\'s P(hit), the joint probability (same-game and same-player correlation kept), the independence product, and EV at your payout. Log a slip with the copy-command button (slips.py --log appends it to slips_log.jsonl in the repo) and the Results tab grades it.'},
 first:{label:'First TD', note:'First TD of the game. Set who receives the opening kickoff once the coin toss is known: the receiving team scores the first TD about 59% of the time at even odds (2023–25 data). Books are often slow to move after the toss.'},
 rz:{label:'Red Zone', note:'Red-zone and end-zone usage from play-by-play. Share = player\'s cut of his team\'s red-zone carries, inside-10 carries, red-zone targets and end-zone targets. Switch seasons to compare with 2025.'},
 bring:{label:'Bring-backs', note:'Pass catchers on opposite sides of the same game both scoring. Lift shows shared game-script correlation.'},
 edge:{label:'Edge Board', note:''},
 results:{label:'Results', note:'How the projections did once games were played. Weeks marked backfill were rebuilt after the fact from pre-game data only (no odds).'}
};
const tabs=document.getElementById('tabs');
Object.entries(TABS).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v.label;b.dataset.k=k;b.onclick=()=>{st.tab=k;st.sort=null;try{localStorage.setItem('ezl_tab',k)}catch(e){};render()};tabs.appendChild(b)});


// ---------- slips: Underdog-style pricer from the saved sim draws (draws.bin), log kept in this browser ----------
const SL_STATS={fpts:'fantasy',rec:'receptions',rec_yds:'rec yds',rush_yds:'rush yds',pass_yds:'pass yds',pass_att:'pass att'};
const SL_WORDS=[['pass_att',/pass(ing)?\s*att(empts|s)?|attempts/],['pass_yds',/pass(ing)?\s*(yds|yards)/],['rec_yds',/rec(eiving)?\s*(yds|yards)|receiving/],['rush_yds',/rush(ing)?\s*(yds|yards)|rushing/],['rec',/receptions?|catches|\brec\b/],['fpts',/fantasy|fpts|\bfp\b|points|\bpts\b/]];
const SL_HI=/\b(higher|more|over|o)\b/, SL_LO=/\b(lower|less|under|u)\b/;
const SL_DEFPAY={2:3,3:6,4:12,5:20,6:27};
const slPay=()=>(D&&D.draws&&D.draws.payout)||SL_DEFPAY;
const normName=n=>String(n||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[.'\-]/g,'').replace(/\b(jr|sr|ii|iii|iv|v)\b/g,'').replace(/\s+/g,' ').trim();
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function parseLeg(text){
  let t=text.trim().replace(/[\u2014\u2013-]/g,' ').toLowerCase(); if(!t) return null;
  const dir=SL_HI.test(t)?'higher':SL_LO.test(t)?'lower':null; const stat=(SL_WORDS.find(([k,re])=>re.test(t))||[])[0];
  const m=t.match(/(?<![\w.])(\d+(?:\.\d+)?)(?![\w.])/);
  if(!dir||!stat||!m) return {raw:text,error:'need a player, a line, higher/lower and a stat'};
  let name=t.replace(SL_HI,' ').replace(SL_LO,' ').replace(m[0],' '); SL_WORDS.forEach(([k,re])=>{name=name.replace(re,' ')});
  name=name.replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
  return {raw:text,name,stat,line:parseFloat(m[1]),dir};
}
let DR=null, DRP=null;
function loadDraws(){
  if(DR||!D||!D.draws) return Promise.resolve(DR);
  if(!DRP) DRP=(async()=>{const buf=new Uint8Array(await (await fetch(D.draws.file,{cache:'no-store'})).arrayBuffer()); const n=D.draws.n, L=D.draws.layout; const map=new Map();
    for(const pl of D.draws.players){let off=pl.offset; const vals={};
      for(const stt of pl.stats){const sp=L[stt]; const arr=new Float32Array(n);
        if(sp.bytes===2){for(let i=0;i<n;i++) arr[i]=((buf[off+2*i]|(buf[off+2*i+1]<<8))-(sp.offset||0))/sp.scale; off+=2*n;}
        else {for(let i=0;i<n;i++) arr[i]=(buf[off+i]-(sp.offset||0))/sp.scale; off+=n;}
        vals[stt]=arr;}
      map.set(pl.pid,{...pl,vals,norm:normName(pl.name)});}
    DR=map; return DR;})();
  return DRP;
}
function findPlayer(name){const nn=normName(name); const all=[...DR.values()]; let hit=all.filter(p=>p.norm===nn); if(hit.length===1) return hit[0];
  const parts=nn.split(' '); if(parts.length>=2){hit=all.filter(p=>p.norm.split(' ').pop()===parts[parts.length-1]&&p.norm[0]===parts[0][0]); if(hit.length===1) return hit[0];} return null;}
function priceSlip(text,payout){
  const legs=text.split(/\n|;/).map(parseLeg).filter(Boolean); const out=[], masks=[];
  for(const lg of legs){ if(lg.error){out.push(lg);continue;} const p=findPlayer(lg.name); if(!p){out.push({...lg,error:"player not in this week's sim"});continue;}
    const v=p.vals[lg.stat]; if(!v){out.push({...lg,player:p.name,error:`${SL_STATS[lg.stat]} is not simulated for a ${p.pos}`});continue;}
    const n=v.length, hit=new Uint8Array(n); let c=0; for(let i=0;i<n;i++){const h=lg.dir==='higher'?v[i]>lg.line:v[i]<lg.line; hit[i]=h?1:0; c+=h?1:0;}
    masks.push(hit); const srt=Array.from(v).sort((a,b)=>a-b); out.push({...lg,pid:p.pid,player:p.name,team:p.team,p:c/n,median:srt[Math.floor(n/2)]}); }
  const res={legs:out,n_legs:legs.length}; const ok=out.length&&out.every(l=>!l.error)&&legs.length>=2;
  if(!ok){res.error=legs.length<2?'a slip needs 2+ legs':'fix the legs marked above'; return res;}
  const n=masks[0].length; let j=0; for(let i=0;i<n;i++){let all=1; for(const m of masks){if(!m[i]){all=0;break;}} j+=all;}
  res.p_joint=j/n; res.p_prod=out.reduce((a,l)=>a*l.p,1); res.payout=payout||slPay()[legs.length]||null;
  res.ev=res.payout?res.p_joint*res.payout-1:null; res.breakeven=res.p_joint>0?1/res.p_joint:null;
  // same-player legs (a QB's pass yards and fantasy): Underdog may block or reprice them; also price the slip without the extras
  const seen=new Set(), keep=[]; out.forEach((l,i)=>{l.same_player=seen.has(l.pid); seen.add(l.pid); if(!l.same_player) keep.push(i);});
  if(keep.length<out.length){res.same_player=true; if(keep.length>=2){let j2=0; for(let i=0;i<n;i++){let all=1; for(const k of keep){if(!masks[k][i]){all=0;break;}} j2+=all;} res.p_joint_ex=j2/n; res.n_legs_ex=keep.length; res.payout_ex=payout?payout*(SL_DEFPAY[keep.length]||1)/(SL_DEFPAY[out.length]||1):(slPay()[keep.length]||null); res.ev_ex=res.payout_ex?res.p_joint_ex*res.payout_ex-1:null;} else {res.p_joint_ex=null; res.n_legs_ex=keep.length;}}
  return res;
}
function slipCommand(res,payout){const q=res.legs.map(g=>'"'+String(g.raw||'').replace(/"/g,"'").trim()+'"').join(' '); return `python slips.py ${q}${payout?` --payout ${payout}`:''} --log`;}
function slipLogHtml(){const S=(RES&&RES.slips)||{rows:[],summary:{}}; const rows=S.rows||[]; if(!rows.length) return '<p class="note" style="margin-top:12px">No slips logged yet. Log one with the copy-command button (it appends to slips_log.jsonl in the repo; commit it) and it is graded here once its week is complete.</p>';
  const sm=S.summary||{}; const row=s=>{const legs=(s.legs||[]).map(x=>`${x.player} ${x.dir==='higher'?'▲':'▼'}${x.line} ${SL_STATS[x.stat]}${x.same_player?' <span class="pos q" title="same player as an earlier leg">same player</span>':''}${x.res?` <span class="${x.res==='hit'?'edge-pos':x.res==='miss'?'edge-neg':''}" style="font-size:11px">${x.res}${x.actual!=null?` (${x.actual})`:''}</span>`:''}`).join('<br>');
    const st=s.status==='won'?`<span class="edge-pos">won +${s.units.toFixed(1)}u</span>`:s.status==='lost'?'<span class="edge-neg">lost −1u</span>':s.status==='refund'?'void':'<span style="color:var(--muted)">pending</span>';
    return `<tr><td class="l">W${s.week}</td><td class="l n" style="white-space:normal">${legs}</td><td>${pct(s.p_joint)}${s.p_joint_ex!=null?`<br><span style="color:var(--muted);font-size:11px">${pct(s.p_joint_ex)} w/o same-player</span>`:''}</td><td>${pct(s.p_prod)}</td><td>${s.payout?s.payout+'x':'–'}</td><td>${s.ev==null?'–':`<span class="${s.ev>=0?'edge-pos':'edge-neg'}">${(s.ev*100).toFixed(1)}%</span>`}</td><td>${st}</td></tr>`;};
  return `<h2 class="sec" style="margin-top:14px">Slip log · ${sm.graded?`${sm.won}–${sm.graded-sm.won}, ${sm.units>=0?'+':''}${sm.units.toFixed(1)}u (expected ${sm.expected>=0?'+':''}${sm.expected.toFixed(1)}u)`:`${rows.length} logged`}${sm.pending?` · ${sm.pending} pending`:''}${sm.refund?` · ${sm.refund} void`:''}</h2><div class="tbl"><table><thead><tr><th class="l">Wk</th><th class="l">Legs</th><th>Joint</th><th>Product</th><th>Payout</th><th>EV</th><th>Result</th></tr></thead><tbody>${rows.slice().reverse().map(row).join('')}</tbody></table></div>`;}
function renderSlipRes(r){const legRow=g=>`<tr><td class="l n">${g.error?esc(g.raw):`${g.player} <span style="color:var(--muted)">${g.team}</span>`}</td><td class="l">${g.stat?SL_STATS[g.stat]:'–'}</td><td>${g.line==null?'–':g.line}</td><td class="l">${g.dir||'–'}</td><td>${g.median==null?'–':g.median.toFixed(1)}</td><td>${g.error?`<span class="edge-neg">${esc(g.error)}</span>`:pct(g.p)}</td></tr>`;
  const corr=r.p_prod>0?r.p_joint/r.p_prod:null;
  return `<div class="tbl"><table><thead><tr><th class="l">Leg</th><th class="l">Stat</th><th>Line</th><th class="l">Pick</th><th>Our median</th><th>P(hit)</th></tr></thead><tbody>${r.legs.map(g=>legRow(g).replace('</td><td class="l">',(g.same_player?' <span class="pos q" title="same player as an earlier leg: Underdog may block or reprice">same player</span>':'')+'</td><td class="l">')).join('')}</tbody></table></div>`+
    (r.error?`<p class="note edge-neg">${esc(r.error)}</p>`:`<h3 style="margin-top:10px">Joint ${pct(r.p_joint)} · ${r.payout?`${r.payout}x → EV <span class="${r.ev>=0?'edge-pos':'edge-neg'}">${(r.ev*100).toFixed(1)}%</span>`:'type a payout for EV'}</h3>${r.same_player?`<p class="note"><b>Same-player legs:</b> Underdog may block or reprice them. Without them: ${r.p_joint_ex!=null?`${r.n_legs_ex} legs, joint ${pct(r.p_joint_ex)}${r.payout_ex?`, ${r.payout_ex}x → EV <span class="${r.ev_ex>=0?'edge-pos':'edge-neg'}">${(r.ev_ex*100).toFixed(1)}%</span>`:''}`:'fewer than two legs left'}.</p>`:''}<p class="note">Product of legs (independence) ${pct(r.p_prod)}${corr?` · joint ÷ product ${corr.toFixed(2)} (${corr>1.02?'legs help each other':corr<0.98?'legs work against each other':'about independent'})`:''} · break-even payout ${r.breakeven?r.breakeven.toFixed(1)+'x':'–'} · ${DR?DR.size:0} players, ${D.draws?D.draws.n:0} sim games. Ties on whole-number lines count as misses here; Underdog voids the leg.</p><p><button id="slipcmd" class="btn" style="margin-left:0">Copy command</button> <code id="slipcmdtxt">${esc(slipCommand(r,parseFloat(st.slipPay)||null))}</code> <span class="note">logs the slip to slips_log.jsonl (commit it); graded on the Results tab.</span></p>`);}

const gEl=document.getElementById('games');
// kickoff handling: games carry kick_utc (ISO, from run_week); older slates only the Eastern 'YYYY-MM-DD HH:MM' string
const kickMs = g => { if(g.kick_utc) return Date.parse(g.kick_utc); if(!g.kickoff) return 0; const m=+g.kickoff.slice(5,7); return Date.parse(g.kickoff.replace(' ','T')+':00'+((m>=11||m<=2)?'-05:00':'-04:00')); };
const started = g => !!g.locked || (kickMs(g)>0 && kickMs(g) <= Date.now());
const ptFmt = new Intl.DateTimeFormat('en-US',{weekday:'short',hour:'numeric',minute:'2-digit',timeZone:'America/Los_Angeles'});
const ptStr = g => kickMs(g) ? ptFmt.format(new Date(kickMs(g))).replace(',','') : '';
function slotOf(g){ // chip-bar group label, Pacific time
  if(!kickMs(g)) return 'TBD';
  const parts=new Intl.DateTimeFormat('en-US',{weekday:'short',hour:'numeric',hour12:false,timeZone:'America/Los_Angeles'}).formatToParts(new Date(kickMs(g)));
  const wd=parts.find(p=>p.type==='weekday').value, h=(+parts.find(p=>p.type==='hour').value)%24;
  if(wd!=='Sun') return wd;
  return h<9?'Sun intl':h<12?'Sun early':h<16?'Sun late':'Sun night';
}
function orderGames(){ // kickoff order everywhere; games already under way go last
  if(!D||!D.games) return;
  D.games.sort((a,b)=>(started(a)-started(b))||(kickMs(a)-kickMs(b))||a.game_id.localeCompare(b.game_id));
}

}

function table(cols, rows, defSort){
  const s = st.sort || defSort;
  const sc=cols.find(c=>c.k===s), sv=sc&&sc.sv?sc.sv:(r=>r[s]);   // a column may define sv(row) as its sort value (e.g. kickoff order for games)
  rows = rows.slice().sort((a,b)=>{const x=sv(a),y=sv(b);return (typeof x==='string'? x.localeCompare(y): (x-y))*st.dir});
  let h='<div class="tbl"><table><thead><tr>'+cols.map(c=>`<th class="${c.l?'l':''}" data-k="${c.k}" scope="col">${c.h}${(s===c.k)?(st.dir<0?' ▾':' ▴'):''}</th>`).join('')+'</tr></thead><tbody>';
  h+=rows.map(r=>'<tr>'+cols.map(c=>`<td class="${c.cls||''} ${c.l?'l':''}">${c.f?c.f(r):r[c.k]}</td>`).join('')+'</tr>').join('');
  return h+'</tbody></table></div>';
}

      </div>`+(()=>{const sb=R.slips_backtest; if(!sb) return ''; const L={recn:'Receptions',fpts:'Fantasy (half-PPR)',att:'Pass attempts',rush:'Rush yds',rec:'Rec yds',pass:'Pass yds'}; return `<div class="card" style="margin-top:12px"><span class="tag">Slip stats backtest · 2024–25</span><h3>${['recn','fpts','att'].map(k=>`${L[k]} ${sb.kinds[k].within}/${sb.kinds[k].buckets}`).join(' · ')}</h3><p>Single legs, weeks 4–18 of 2024 and 2025: P(stat ≥ rung) in 5-point buckets within the 95% range, and median error vs a season-average baseline. Joint prices rest on these marginals plus the shared game draw.</p><div class="tbl" style="border:0"><table><thead><tr><th class="l">Stat</th><th>Legs</th><th>Buckets in range</th><th>MAE median</th><th>Baseline</th><th>Largest miss (pred / actual ±)</th></tr></thead><tbody>${['recn','fpts','att','rec','rush','pass'].map(k=>{const v=sb.kinds[k]; const worst=v.cal.slice().sort((a,b)=>(Math.abs(b.pred-b.actual)-b.pm)-(Math.abs(a.pred-a.actual)-a.pm))[0]; return `<tr><td class="l">${L[k]}</td><td>${v.n}</td><td>${v.within} of ${v.buckets}</td><td>${v.mae_median}</td><td>${v.mae_baseline}</td><td>${worst?`${worst.pred} / ${worst.actual} ± ${worst.pm}`:'–'}</td></tr>`}).join('')}</tbody></table></div></div>`})()+
      (R.last_week.length?`<h2 class="sec" style="margin-top:16px">${R.last_week_meta?`${R.last_week_meta.season} Week ${R.last_week_meta.week} top 40 · ${R.last_week_meta.graded} of ${R.last_week_meta.total} games graded`:'Last graded week · top 40'}</h2>`+table([
        {k:'name',h:'Player',l:1,cls:'n',f:r=>`${r.name}<span class="pos">${r.pos||''}</span>`},{k:'team',h:'Tm',l:1},
        {k:'p_any',h:'Anytime',f:r=>pct(r.p_any)},{k:'hit',h:'Scored',f:r=>r.hit?'<span class="edge-pos">✓</span>':'<span class="edge-neg">✗</span>'},
        {k:'p_first',h:'1st TD',f:r=>pct(r.p_first)},{k:'first_hit',h:'1st?',f:r=>r.first_hit?'<span class="edge-pos">✓</span>':''},{k:'p_2plus',h:'2+ TD',f:r=>r.p_2plus==null?'–':pct(r.p_2plus)},{k:'two_hit',h:'2+?',f:r=>r.two_hit?'<span class="edge-pos">✓</span>':''}],R.last_week,'p_any'):'')+
      (R.bets.length?`<h2 class="sec" style="margin-top:16px">Bet log</h2>`+table([{k:'week',h:'Wk',l:1},{k:'bet',h:'Bet',l:1,cls:'n'},{k:'price',h:'Price',f:r=>am(r.price)},{k:'book',h:'Book',l:1},{k:'ev',h:'EV',f:r=>(r.ev*100).toFixed(1)+'%'},{k:'profit',h:'Result',f:r=>`<span class="${r.won?'edge-pos':'edge-neg'}">${r.profit>0?'+':''}${r.profit}u</span>`}],R.bets,'week'):'');
    }
  } else if(st.tab==='bring'){
    const rows=filt(D.bring.map(r=>({...r,name:r.a+' '+r.b,team:r.a_team})));
    html=table([{k:'game',h:'Game',l:1,sv:r=>-gameRank(r.a_team),f:r=>{const g=D.games[gameRank(r.a_team)];return g?`${g.away} @ ${g.home} <span style="color:var(--muted)">${ptStr(g)}</span>`:r.game}},{k:'a',h:'Side A',l:1,cls:'n',f:r=>`${r.a} <span style="color:var(--muted)">${r.a_team}</span>`},{k:'b',h:'Side B',l:1,cls:'n',f:r=>`${r.b} <span style="color:var(--muted)">${r.b_team}</span>`},
      {k:'joint',h:'Both score',f:r=>pct(r.joint)},{k:'lift',h:'Lift',f:r=>`<span class="lift ${r.lift>1.1?'up':''}">${r.lift.toFixed(2)}×</span>`},{k:'fair',h:'Fair',f:r=>am(r.fair)},
      {k:'bk',h:'Book / edge',f:r=>oddsCell('bb|'+r.a+'|'+r.b,r.joint)}],rows,'joint');
  } else {
    const vac=D.vacated.filter(v=>!st.game||gameOf(v.team)===st.game);
    const edAll=(D.edges||[]).filter(e=>!st.game||gameOf(e.team)===st.game), nBench=edAll.filter(e=>e.role==='Bench').length;
    const ed=edAll.filter(e=>st.showBench||e.role!=='Bench'), edTD=ed.filter(e=>e.market!=='yds'), edY=ed.filter(e=>e.market==='yds');
    const edgeCols=[{k:'bet',h:'Bet',l:1,cls:'n'},{k:'team',h:'Tm',l:1},{k:'role',h:'Role',l:1,f:r=>roleTag(r.role)},{k:'model_p',h:'Model',f:r=>pct(r.model_p)},{k:'mkt_p',h:'Market',f:r=>pct(r.mkt_p)},{k:'blend_p',h:'Blend',f:r=>pct(r.blend_p)},{k:'nbooks',h:'Books'},{k:'med',h:'Median',f:r=>am(r.med)},{k:'ev_med',h:'EV@med',f:r=>`<span class="edge-pos">${(r.ev_med*100).toFixed(1)}%</span>`},{k:'best',h:'Best',f:r=>am(r.best)},{k:'book',h:'Book',l:1},{k:'ev',h:'EV@best',f:r=>`<span class="edge-pos">${(r.ev*100).toFixed(1)}%</span>`},{k:'kalshi',h:'Kalshi',f:r=>r.kalshi==null?'–':r.kalshi_liquid?am(r.kalshi):`<span style="color:var(--muted)" title="under $100 available at the ask: reference only, not used for EV">${am(r.kalshi)} ref</span>`}];
    const nWeak=(D.players||[]).filter(p=>p.weak_spot).length;
    html=(D.odds_live?`<p class="note" style="margin-bottom:8px">${D.odds_asof?`Prices as of ${D.odds_asof} (live feed off this run). `:''}${nWeak?`${nWeak} mobile QBs are tagged "weak spot" and kept off this board. `:''}<label><input type="checkbox" id="showbench"${st.showBench?' checked':''}> Show bench players (${nBench} hidden${st.showBench?', shown':''}) · Starter = top depth slot or 60%+ snaps, Rotational = 30–60%, Bench = under 30% or a deep depth slot</label></p><h2 class="sec">Priced edges · anytime, first and 2+ TD · 2+ books, EV 5%+ at the median book, 50/50 model–market blend, market de-vigged with each book's measured hold</h2>`+(edTD.length?table(edgeCols,edTD,'ev_med'):'<p class="note">No TD bets clear 5% EV right now.</p>')+`<h2 class="sec" style="margin-top:14px">Yard edges · rushing, receiving and passing ladders · 2+ books, EV 5%+ at the median book, lines of 10+ yards (100+ passing)</h2>`+(edY.length?table(edgeCols,edY,'ev_med'):'<p class="note">No yard rungs clear 5% EV right now.</p>'):'<p class="note">Live odds are off. Add an ODDS_API_KEY secret in GitHub to fill this board automatically.</p>')+`<div class="cards" style="margin-top:14px">
      <div class="card"><span class="tag">Live this week</span><h3>Vacated TD share</h3><p>Players ruled out or on IR who held real red-zone opportunity. Their teammates' projections already absorb it; books often lag.</p>
        <div class="tbl" style="border:0">${vac.length?`<table><tbody>${vac.map(v=>`<tr><td class="n l">${v.name}</td><td class="l">${v.team}</td><td>${v.kind}</td><td>${pct(v.share)}</td></tr>`).join('')}</tbody></table>`:'<p>None on this game.</p>'}</div></div>

      ${[
       ['Next build','Pick\'em yardage lines','Receiving/rushing/passing yard medians for Underdog and PrizePicks from the same sim, so TD and yardage legs correlate correctly.'],
       ['Next build','Red-zone snap share','2025 backtest: red-zone snap share adds real signal on top of this model (p = 0.001). Needs a 2026 source such as McAnalytics.'],
       ['Next build','Closing line tracker','Log bets against the closing price to confirm the model beats the market over time.']
      ].map(c=>`<div class="card"><span class="tag">${c[0]}</span><h3>${c[1]}</h3><p>${c[2]}</p></div>`).join('')}
    </div>`;
  }
  V.innerHTML=html;

  if(st.tab==='slips'){
    const stx=document.getElementById('sliptext'); if(stx) stx.oninput=()=>{st.slipText=stx.value;try{localStorage.setItem('ezl_slipdraft',stx.value)}catch(e){}};
    const sp=document.getElementById('slippay'); if(sp) sp.oninput=()=>{st.slipPay=sp.value};
    const go=document.getElementById('slipgo'); if(go) go.onclick=async()=>{st.slip={msg:'loading sim draws…'};render();
      try{await loadDraws();}catch(e){st.slip={msg:'could not load draws.bin'};render();return;}
      if(!DR){st.slip={msg:'no sim draws for this week'};render();return;}
      const res=priceSlip(st.slipText||'',parseFloat(st.slipPay)||null); st.slip={res}; render();};
    const cm=document.getElementById('slipcmd'); if(cm) cm.onclick=()=>{const t=document.getElementById('slipcmdtxt'); try{navigator.clipboard.writeText(t?t.textContent:'');st.slip={...(st.slip||{}),msg:'command copied'};render();}catch(e){}};
  }
  const sb=document.getElementById('showbench'); if(sb) sb.onchange=()=>{st.showBench=sb.checked;try{localStorage.setItem('ezl_bench',sb.checked?'1':'0')}catch(e){};render()};
  V.querySelectorAll('details.wk').forEach(d=>d.ontoggle=()=>{if(d.open)st.open.add(d.dataset.wk);else st.open.delete(d.dataset.wk)});
  V.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(st.sort===k)st.dir*=-1;else{st.sort=k;st.dir=-1}render()});
  V.querySelectorAll('input[name=ykind]').forEach(r=>r.onchange=()=>{st.ykind=r.value;st.sort=null;render()});
  V.querySelectorAll('input[name=mkt]').forEach(r=>r.onchange=()=>{st.mkt=r.value;render()});
  const so=document.getElementById('shortonly'); if(so) so.onchange=()=>{st.shortOnly=so.checked;render()};
  V.querySelectorAll('input[name=pmode]').forEach(r=>r.onchange=()=>{st.pmode=r.value;st.sort=null;render()});
  V.querySelectorAll('input.odds[data-i]').forEach(i=>i.onchange=()=>{const v=parseFloat(i.value);if(isNaN(v)||Math.abs(v)<100)delete st.bookPrice[i.dataset.i];else st.bookPrice[i.dataset.i]=v;render()});
  V.querySelectorAll('.odds:not([data-i])').forEach(i=>i.onchange=()=>{const v=i.value.trim();if(v)book[i.dataset.key]=v;else delete book[i.dataset.key];try{localStorage.setItem('ezl_book',JSON.stringify(book))}catch(e){};render()});
  const kf=document.getElementById('rzs'); if(kf) kf.onchange=()=>{st.sort=null;render()};
  V.querySelectorAll('.rv select').forEach(x=>x.onchange=()=>{st.recv[x.dataset.g]=x.value;render()});
}
document.getElementById('q').oninput=render;document.getElementById('posf').onchange=render;
async function boot(){ if(!D){ try{ D = await (await fetch('latest.json',{cache:'no-store'})).json(); }catch(e){ document.getElementById('view').innerHTML='<p class="note">Could not load latest.json. The weekly job may not have run yet.</p>'; return; } }
  if(!RES){ try{ RES = await (await fetch('results.json',{cache:'no-store'})).json(); }catch(e){} }
  if(!TABS[st.tab]) st.tab='any';
  setMeta(); render(); }
boot();
</script>
