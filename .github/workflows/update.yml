name: Update projections

on:
  schedule:
    - cron: "0 17 * * 2"    # Tue 10:00 PT (no odds)
    - cron: "0 19 * * 4"    # Thu 12:00 PT (no odds)
    - cron: "0 17 * * 6"    # Sat 10:00 PT + live odds
    - cron: "45 16 * * 0"   # Sun  9:45 PT after inactives + live odds
    - cron: "15 20 * * 0"   # Sun  1:15 PT late games (no odds)
  workflow_dispatch:
    inputs:
      use_odds:
        description: "Pull live odds"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: true

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run model
        env:
          ODDS_API_KEY: ${{ (github.event.schedule == '0 17 * * 6' || github.event.schedule == '45 16 * * 0' || inputs.use_odds) && secrets.ODDS_API_KEY || '' }}
        run: python refresh.py
      - name: Publish
        run: |
          git config user.name "endzone-bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json slate_*.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Projections $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
