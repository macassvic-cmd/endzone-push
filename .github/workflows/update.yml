name: Update projections

# Times are PDT (UTC-7); GitHub cron often fires late at round minutes, so slots are off-minute and redundant.
# Odds mode per slot: on = pull unless a pull happened in the last 45 min; cond = pull only if the newest saved
# pull is older than 60 min (protects credits); off = never. See decide_odds.py.
on:
  schedule:
    - cron: "7 17 * * 2"    # Tue 10:07 PT (off)
    - cron: "7 19 * * 4"    # Thu 12:07 PT (off)
    - cron: "37 15 * * 6"   # Sat  8:37 PT (cond)
    - cron: "23 16 * * 6"   # Sat  9:23 PT (on)
    - cron: "52 16 * * 6"   # Sat  9:52 PT (cond)
    - cron: "37 15 * * 0"   # Sun  8:37 PT (cond)
    - cron: "23 16 * * 0"   # Sun  9:23 PT (on) after inactives
    - cron: "52 16 * * 0"   # Sun  9:52 PT (cond)
    - cron: "15 20 * * 0"   # Sun  1:15 PT late games (off: reuses the last saved pull for games not yet kicked off)
    - cron: "7 4 * * 1"     # Sun  9:07 PM PT grading after the late games (off)
    - cron: "13 14 * * 1"   # Mon  7:13 AM PT grading after SNF once nflverse pbp updates (off)
    - cron: "13 14 * * 2"   # Tue  7:13 AM PT grading after MNF (off)
  repository_dispatch:
    types: [update]         # external scheduler (see README); client_payload.use_odds: on | cond | off (default on)
  workflow_dispatch:
    inputs:
      use_odds:
        description: "Pull live odds"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: true

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Decide whether to pull odds
        id: odds
        run: |
          case "${{ github.event_name }}" in
            schedule)
              case "${{ github.event.schedule }}" in
                "23 16 * * 6"|"23 16 * * 0") MODE=on ;;
                "37 15 * * 6"|"52 16 * * 6"|"37 15 * * 0"|"52 16 * * 0") MODE=cond ;;
                *) MODE=off ;;
              esac ;;
            repository_dispatch) MODE="${{ github.event.client_payload.use_odds || 'on' }}" ;;
            workflow_dispatch) MODE="${{ inputs.use_odds && 'on' || 'off' }}" ;;
            *) MODE=off ;;
          esac
          python decide_odds.py "$MODE"
      - name: Tests and data
        run: |
          python test_nan_safety.py
          python refresh.py --data-only
      - name: Smoke-test grading on the committed slates (fails loudly before any odds are pulled)
        run: python results.py
      - name: Run model
        env:
          ODDS_API_KEY: ${{ steps.odds.outputs.use_odds == 'true' && secrets.ODDS_API_KEY || '' }}
          ODDS_SAVE: odds_raw.json
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
        run: python run_week.py
      - name: Grade
        id: grade
        run: python results.py
      - name: Save raw odds (download from the run's Artifacts to rerun locally with ODDS_MOCK)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odds-raw
          path: odds_raw.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish (runs even if grading failed, so a finished board is never left unpublished; the job still fails)
        if: always() && steps.odds.outcome == 'success'
        run: |
          git config user.name "endzone-bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json slate_*.json results.json odds_history edge_log draws.bin bets_frozen.json parlay_log research
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Projections $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
